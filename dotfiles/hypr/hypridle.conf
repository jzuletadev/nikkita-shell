# ~/nikkita-shell/dotfiles/hypr/hypridle.conf

general {
    lock_cmd = qs ipc call nikkita lock || pidof hyprlock || hyprlock   # Quickshell's; hyprlock if qs isn't running
    before_sleep_cmd = loginctl lock-session  # locked before suspending
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 15 min: dim the screen (on battery only)
listener {
    timeout = 900
    on-timeout = ~/nikkita-shell/scripts/idle.sh dim
    on-resume = brightnessctl -q -r
}

# 30 min: lock the session (on battery only)
listener {
    timeout = 1800
    on-timeout = ~/nikkita-shell/scripts/idle.sh lock
}

# 35 min: turn the screen off (on battery only)
listener {
    timeout = 2100
    on-timeout = ~/nikkita-shell/scripts/idle.sh dpms-off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 75 min: suspend (on battery only)
listener {
    timeout = 4500
    on-timeout = ~/nikkita-shell/scripts/idle.sh suspend
}
