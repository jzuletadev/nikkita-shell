# ~/nikkita-shell/dotfiles/hypr/hyprlock.conf

$font = Adwaita Sans   # Phase 26: same UI font as the bar, menus and login

general {
    hide_cursor = true
    ignore_empty_input = true   # Enter on an empty field doesn't count as a failed attempt
}

animations {
    enabled = true
    bezier = smoothOut, 0.16, 1, 0.3, 1   # same curve as hyprland.lua
    animation = fadeIn, 1, 4, smoothOut
    animation = fadeOut, 1, 4, smoothOut
    animation = inputFieldDots, 1, 2, smoothOut
}

background {
    monitor =
    # symlink kept by scripts/wallpaper.sh: the lock screen follows the desktop
    path = ~/.local/state/nikkita-shell/wallpaper
    color = rgb(20, 20, 20)   # shown if the image is missing
    blur_passes = 3
    blur_size = 7
    brightness = 0.6          # darker, so the white text stays readable on any wallpaper
    vibrancy = 0.15
}

# clock
label {
    monitor =
    text = <span font_features="tnum">$TIME</span>   # tabular digits: no width jumps
    color = rgba(224, 224, 224, 0.95)
    font_size = 64
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    position = 0, 110
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(168, 168, 168, 0.9)
    font_size = 14
    font_family = $font
    shadow_passes = 2
    position = 0, 45
    halign = center
    valign = center
}

# password: invisible while empty (fade_on_empty), appears with the first key
input-field {
    monitor =
    size = 240, 42
    outline_thickness = 1
    rounding = -1                             # -1 = fully rounded (pill)
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true                        # center the dots and the waiting animation
    outer_color = rgba(149, 100, 221, 0.8)     # accent ring, rewritten by scripts/accent.sh (Phase 45)
    inner_color = rgba(20, 20, 20, 0.7)
    font_color = rgb(224, 224, 224)
    
    # Feedback while checking, after pressing Enter
    check_color = rgba(224, 168, 78, 1.0)     # amber ring during the PAM check
    check_text = <span foreground="##e0a84e"><i>Checking...</i></span>
    
    # Failure and Caps Lock states
    fail_color = rgba(224, 95, 101, 1.0)      # red ring on failure
    fail_text = <span foreground="##e05f65">$PAMFAIL</span>
    capslock_color = rgba(224, 168, 78, 1.0)  # amber ring = Caps Lock on
    
    font_family = $font
    placeholder_text = <span foreground="##a8a8a8"><i>Password...</i></span>
    hide_input = false
    fade_on_empty = true
    fade_timeout = 2000                       # hides 2 s after being emptied
    position = 0, -40
    halign = center
    valign = center
}
