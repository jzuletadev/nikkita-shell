# ~/nikita-shell/dotfiles/kitty/light-theme.auto.conf
#
# Light theme, in grays like the desktop. The ANSI colors are darker than in the
# dark one so they read on a light background; "white" stays light, as convention
# says (programs use it as a background, not as text).

background             #f2f2f2
foreground             #1a1a1a
selection_background   #cfcfcf
selection_foreground   #1a1a1a
cursor                 #1a1a1a
cursor_text_color      #f2f2f2
url_color              #4a4a4a

active_border_color    #5c5c5c
inactive_border_color  #d0d0d0
active_tab_background  #f2f2f2
active_tab_foreground  #1a1a1a
inactive_tab_background #e2e2e2
inactive_tab_foreground #8a8a8a

# black
color0  #1a1a1a
color8  #6e6e6e
# red
color1  #c0392b
color9  #d9534f
# green
color2  #3a8a2e
color10 #4c9e3f
# yellow
color3  #a06a00
color11 #b88300
# blue
color4  #1565a8
color12 #2b7fc4
# magenta
color5  #9b4d86
color13 #b2649e
# cyan
color6  #13808f
color14 #2296a5
# white
color7  #c0bfbc
color15 #ffffff
